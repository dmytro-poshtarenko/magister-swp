name: magister-swp

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?задайте DB_NAME у файлі .env}
      POSTGRES_USER: ${DB_USER:?задайте DB_USER у файлі .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD у файлі .env}
    ports:
      - 127.0.0.1:${DB_PORT:-5442}:5432
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 15

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - 127.0.0.1:${ADMINER_PORT:-8081}:8080
    depends_on:
      db:
        condition: service_healthy

  loki:
    image: grafana/loki:3.6.0
    command: ['-config.file=/etc/loki/config.yaml']
    ports:
      - 127.0.0.1:${LOKI_PORT:-3100}:3100
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      # Local only: anyone who can open the page gets full access.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

volumes:
  db-data:
